services:
  db:
    image: postgres:16-alpine
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_USER: theorytracker
      POSTGRES_PASSWORD: theorytracker
      POSTGRES_DB: theorytracker
    ports:
      # Loopback-only. Published ports insert NAT rules AHEAD of the host INPUT
      # chain, so `ufw deny 5432` never blocked a 0.0.0.0 bind. This is the
      # security boundary, not the password.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theorytracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["prod"]
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://theorytracker:theorytracker@db:5432/theorytracker
      # Runtime-only (blast radius: this service). Lets `prisma db seed` run here
      # refuse the demo seed in prod — the migrate image builds target:build, which
      # has no ENV NODE_ENV, so without this the seed guard would see it undefined.
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://theorytracker:theorytracker@db:5432/theorytracker
      # Fail to start rather than boot with a missing session-signing key.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env - generate with node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"}
      # Guarded: unset DOMAIN yields https:// with no host, which boots into a
      # broken TLS/callback state instead of failing loudly.
      AUTH_URL: https://${DOMAIN:?set DOMAIN in .env}
    healthcheck:
      # /api/health reports only whether the DB answers — safe to expose.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(e=>{console.error(e.cause?.code||e.message);process.exit(1)})\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
